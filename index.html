<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Öğretmenler Gününüz Kutlu Olsun</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    p.sub {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0 0 26px;
    }
    button.play-btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      border-radius: 999px;
      padding: 16px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 18px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button.play-btn:active {
      transform: scale(0.98);
    }
    audio {
      width: 100%;
      margin-top: 6px;
      border-radius: 12px;
    }
    .error {
      color: #fca5a5;
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">24 Kasım Öğretmenler Günü</div>
    <h1>Size Özel Bir Mesaj Var</h1>
    <p class="sub">Dinlemek için aşağıdaki butona dokunun</p>
    
    <button class="play-btn" id="bigPlayBtn">▶ Ses Kaydını Dinle</button>
    <audio id="player" controls playsinline preload="metadata"></audio>
    <p class="error" id="errorMsg">Ses dosyası yüklenemedi. Lütfen bağlantıyı kontrol edin.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawId = parseInt(params.get("id"), 10);

    // 1 ile 38 arasında geçerli bir numara yoksa varsayılan olarak 1'i açar
    const id = (!isNaN(rawId) && rawId >= 1 && rawId <= 38) ? rawId : 1;

    // Dosyaları 1.mp3, 2.mp3 ... 38.mp3 olarak yüklediysen bu satır doğrudan çalışır.
    // NOT: Dosyaları 01.mp3, 02.mp3 gibi başına sıfır koyarak yüklediysen 
    // aşağıdaki satırı: const dosyaAdi = `${String(id).padStart(2, "0")}.mp3`; yap.
    const dosyaAdi = `${id}.mp3`;

    const audio = document.getElementById("player");
    const btn = document.getElementById("bigPlayBtn");
    const errorMsg = document.getElementById("errorMsg");

    audio.src = dosyaAdi;

    // Sayfa açılır açılmaz otomatik oynatmayı dener
    window.addEventListener("load", () => {
      audio.play().catch(() => {
        // Mobil tarayıcılar otomatik sesi engellerse kullanıcı büyük butona basar
      });
    });

    btn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", () => {
      btn.textContent = "❚❚ Duraklat";
    });

    audio.addEventListener("pause", () => {
      btn.textContent = "▶ Ses Kaydını Dinle";
    });

    audio.addEventListener("ended", () => {
      btn.textContent = "↻ Tekrar Dinle";
    });

    audio.addEventListener("error", () => {
      errorMsg.style.display = "block";
    });
  </script>
</body>
</html>
